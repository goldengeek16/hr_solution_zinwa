{% extends 'main.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'styles/next_of_kin_form.css' %}">

{% include 'navbar.html' %}

<main class="main-content">
    {% include 'header.html' %}

    <form class="kin-form" method="POST">
        {% csrf_token %}

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Add Next of Kin</h2>
            </div>

            <div class="card-body">
                <div class="form-grid">
                    {% for field in form %}
                    <div class="form-field">
                        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {{ field.errors }}
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>

        <div class="form-actions">
            <a href="{% url 'permanent-employee-kin' %}" class="cancel-btn">Cancel</a>
            <button type="submit" class="save-btn">Save Next of Kin</button>
        </div>
    </form>
</main>
{% endblock content %}
